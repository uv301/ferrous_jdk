# Branch Protection Rules Configuration
# 
# This file defines the branch protection rules for FerrousJDK.
# These rules should be configured in GitHub repository settings:
# Settings > Branches > Branch protection rules > Add rule
#
# Protected branches:
# - main: Main release branch
# - dev: Development integration branch
# - jdk8-lts: JDK8 Long Term Support branch
# - jdk17-lts: JDK17 Long Term Support branch
# - jdk21-lts: JDK21 Long Term Support branch

branch_protection:
  # Main branch - strictest protection
  main:
    required_status_checks:
      strict: true
      contexts:
        - ci/fmt
        - ci/clippy
        - ci/test
        - ci/build
    enforce_admins: true
    required_pull_request_reviews:
      required_approving_review_count: 2
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
    restrictions: null
    block_force_push: true
    allow_force_pushes: false

  # Dev branch - development integration
  dev:
    required_status_checks:
      strict: true
      contexts:
        - ci/fmt
        - ci/clippy
        - ci/test
    enforce_admins: true
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
    restrictions: null
    block_force_push: true
    allow_force_pushes: false

  # LTS branches - maintenance branches
  "jdk*-lts":
    required_status_checks:
      strict: true
      contexts:
        - ci/fmt
        - ci/clippy
        - ci/test
        - ci/build
    enforce_admins: true
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
    restrictions: null
    block_force_push: true
    allow_force_pushes: false
